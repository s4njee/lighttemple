<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A holographic ace of spades rendered in real time with WebGPU. Drag to orbit, scroll to zoom." />
    <title>Ace of Spades</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='25' font-size='26' text-anchor='middle'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #000;
        --text: rgba(255, 255, 255, 0.55);
        --text-strong: rgba(255, 255, 255, 0.85);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 10px;
        pointer-events: none;
        transition: opacity 1.2s ease;
        white-space: nowrap;
      }
      #hint.gone {
        opacity: 0;
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        color: var(--text-strong);
        font-size: 14px;
      }
      #fallback[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #hint {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="A holographic ace of spades. Drag to orbit, scroll or pinch to zoom."></canvas>
    <p id="hint">Drag to orbit · Scroll to zoom</p>
    <p id="fallback" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
